<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17211c">
  <meta name="author" content="听风语低">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="世界工坊">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>世界工坊</title>
  <link rel="icon" href="assets/pwa/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=world-workshop-public-template-20261031-01">
  <link rel="stylesheet" href="mobile-pwa.css?v=world-workshop-public-template-20261031-01">
  <link rel="stylesheet" href="design-polish.css?v=world-workshop-public-template-20261031-01">
  <script src="vendor/mammoth.browser.min.js" defer></script>
  <script src="vendor/fflate.min.js" defer></script>
  <script src="archive.js?v=world-workshop-public-template-20261031-01" defer></script>
  <script src="default-world.js?v=world-workshop-public-template-20261031-01" defer></script>
  <script src="app.js?v=world-workshop-public-template-20261031-01" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand-lockup">
        <img class="brand-mark" src="assets/pwa/icon.svg" alt="">
        <span class="brand-copy"><strong>世界工坊</strong><small>WORLD WORKSHOP</small></span>
      </div>

      <button class="project-switcher" type="button" data-action="edit-project" title="编辑世界档案">
        <span class="project-monogram">W</span>
        <span class="project-meta"><strong id="sidebar-project-name">世界档案</strong><small>世界档案</small></span>
        <span class="project-chevron" aria-hidden="true">⌄</span>
      </button>

      <div class="sidebar-scroll">
        <div class="nav-caption">创作空间</div>
        <div class="nav-caption mobile-more-caption">更多工具</div>
        <nav class="primary-nav">
          <button class="nav-item is-active" type="button" data-view="overview" aria-current="page">
            <span class="nav-icon" data-icon="grid"></span><span>概览</span><span class="nav-arrow">›</span>
          </button>
          <button class="nav-item" type="button" data-view="library">
            <span class="nav-icon" data-icon="book"></span><span>设定库</span><span class="nav-count" id="nav-entry-count">0</span>
          </button>
          <a class="nav-item" href="?view=maps" data-view="maps">
            <span class="nav-icon" data-icon="map"></span><span>地图</span>
          </a>
          <button class="nav-item" type="button" data-view="graph">
            <span class="nav-icon" data-icon="network"></span><span>关系图谱</span>
          </button>
          <button class="nav-item" type="button" data-view="timeline">
            <span class="nav-icon" data-icon="timeline"></span><span>时间线</span><span class="nav-count" id="nav-event-count">0</span>
          </button>
          <button class="nav-item" type="button" data-view="scripts">
            <span class="nav-icon" data-icon="file"></span><span>剧本</span><span class="nav-count" id="nav-script-count">0</span>
          </button>
          <button class="nav-item" type="button" data-view="audit">
            <span class="nav-icon" data-icon="audit"></span><span>设定检查</span><span class="nav-count" id="nav-issue-count">0</span>
          </button>
          <button class="nav-item ai-nav-item" type="button" data-action="ai-assistant" aria-controls="ai-panel" aria-expanded="false">
            <span class="nav-icon ai-nav-avatar"><img src="assets/pwa/icon.svg" alt=""></span><span>AI 助手</span>
          </button>
        </nav>

        <section class="type-nav-section" aria-label="设定类型">
          <div class="type-nav-heading"><div class="nav-caption">设定类型</div><button class="icon-button type-nav-manage" type="button" data-action="type-manager" title="管理设定类型" aria-label="管理设定类型"><span data-icon="edit"></span></button></div>
          <nav class="type-nav" id="type-nav" aria-label="按设定类型浏览"></nav>
        </section>
      </div>

      <div class="sidebar-bottom">
        <button class="sidebar-install" id="pwa-install-button" type="button" hidden>
          <span class="sidebar-install-icon" data-icon="download" aria-hidden="true"></span>
          <span class="sidebar-install-copy"><strong>安装世界工坊</strong><small>添加到主屏幕</small></span>
        </button>
        <div class="local-status">
          <span class="status-light" aria-hidden="true"></span>
          <span class="local-status-copy"><strong>保存在此设备</strong><small id="save-time">所有更改自动保存</small></span>
          <button class="icon-button sidebar-backup" type="button" data-action="export" title="导出世界档案" aria-label="导出世界档案"><span data-icon="download"></span></button>
        </div>
        <div class="sidebar-footnote">WORLD ARCHIVE <span>·</span> v1.3.1</div>
        <div class="sidebar-author">作者：听风语低 <span>·</span> QQ：1378325009</div>
      </div>
    </aside>

    <div class="workspace show-overview-topbar">
      <header class="topbar">
        <button class="mobile-menu icon-button" type="button" data-action="toggle-sidebar" aria-label="打开导航" title="导航"><span data-icon="menu"></span></button>
        <div class="breadcrumb"><span id="breadcrumb-project">世界档案</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb-view">概览</strong></div>
        <div class="topbar-tools">
          <label class="global-search">
            <span data-icon="search" aria-hidden="true"></span>
            <input id="global-search" type="search" autocomplete="off" placeholder="搜索设定、标签与事件…" aria-label="搜索设定、标签与事件">
            <kbd>Ctrl K</kbd>
          </label>
          <button class="icon-button top-theme" type="button" data-action="theme-settings" title="主题与色调" aria-label="主题与色调" aria-haspopup="dialog"><span data-icon="palette"></span></button>
          <button class="icon-button top-import" type="button" data-action="import" title="导入世界档案" aria-label="导入世界档案"><span data-icon="upload"></span></button>
          <button class="button button-primary top-create" type="button" data-action="entry-new"><span data-icon="plus"></span><span>新建设定</span></button>
        </div>
      </header>

      <div class="workspace-body" id="workspace-body">
        <main class="main-content" id="main-view" tabindex="-1"></main>
        <aside class="entry-detail-dock" id="entry-detail-panel" aria-label="设定详情" hidden></aside>
        <aside class="ai-dock" id="ai-panel" aria-label="AI 助手" hidden></aside>
      </div>

      <nav class="mobile-bottom-nav" aria-label="手机主导航">
        <button class="nav-item mobile-tab" type="button" data-view="overview" aria-current="page">
          <span class="mobile-tab-icon" data-icon="grid" aria-hidden="true"></span><span>概览</span>
        </button>
        <button class="nav-item mobile-tab" type="button" data-view="library">
          <span class="mobile-tab-icon" data-icon="book" aria-hidden="true"></span><span>设定库</span>
        </button>
        <button class="nav-item mobile-tab" type="button" data-view="maps">
          <span class="mobile-tab-icon" data-icon="map" aria-hidden="true"></span><span>地图</span>
        </button>
        <button class="nav-item mobile-tab" type="button" data-view="graph" aria-label="关系图谱">
          <span class="mobile-tab-icon" data-icon="network" aria-hidden="true"></span><span>图谱</span>
        </button>
        <button class="mobile-tab mobile-more" type="button" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="false">
          <span class="mobile-tab-icon" data-icon="menu" aria-hidden="true"></span><span>更多</span>
        </button>
      </nav>
    </div>
  </div>

  <div class="sidebar-scrim" data-action="close-sidebar" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <input id="import-input" type="file" accept=".zip,.json,application/zip,application/x-zip-compressed,application/json" hidden>
  <input id="ai-attachment-input" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.html,.htm,.xml,.yaml,.yml,.toml,.ini,.tsv,.log,.png,.jpg,.jpeg,.webp,.gif,.svg,.bmp,.dib,.avif,.tif,.tiff,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/csv,text/html,text/tab-separated-values,application/json,application/xml,text/xml,image/png,image/jpeg,image/webp,image/gif,image/svg+xml,image/bmp,image/avif,image/tiff" multiple hidden>
</body>
</html>
